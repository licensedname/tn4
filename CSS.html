<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Text and Buttons</title>
    <style>
        /* General page styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        /* Heading text styling */
        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        /* Paragraph text styling */
        p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Button base styling */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none; /* Remove underline for links */
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        /* Hover effect */
        .btn:hover {
            background-color: #135397;
            transform: scale(1.05);
            box-shadow: 0 15px 8px rgba(0, 0, 0, 0.2);
        }

        /* Secondary button style */
        .btn-secondary {
            background-color: #28a745;
        }

        .btn-secondary:hover {
            background-color: #174722;
        }
        .btn-thirdly {
            background-color:aqua
        }
        .btn-thirdly:hover {
            background-color: #074b4b;
        }
    </style>
</head>

</body>
</html>
