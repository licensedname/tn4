<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Keyframes — The Initial Pose</title>
  <style>
/* inlined from css/style.css */
:root{
  --accent: #4fe1ff; /* subtle cyan */
  --muted: rgba(255,255,255,0.08);
  --thin: 1px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#000;
  color:#fff;
  font-family: "Courier New", monospace;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}
.bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.02);}
.bg-overlay{position:fixed;inset:0;background:rgba(2,2,2,0.55);backdrop-filter:blur(1px);z-index:-1;}
.top-controls{position:fixed;top:24px;right:28px;display:flex;gap:12px;align-items:center;z-index:30;}
.btn-ghost{background:transparent;border:var(--thin) solid rgba(255,255,255,0.18);color:#fff;padding:8px 12px;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.btn-ghost:hover{border-color:rgba(79,225,255,0.6);color:var(--accent)}
.center-wrap{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px;z-index:10;opacity:0;transform:translateY(6px);animation:contentIn 900ms ease forwards 220ms;}
@keyframes contentIn{to{opacity:1;transform:none}}
.main-title{font-weight:400;font-size:clamp(28px,6vw,72px);letter-spacing:6px;text-transform:uppercase;color:#fff;margin:8px 0;display:inline-block;transform:translateX(-3vw)}
.main-title .accent-green{display:inline-block;transform:translateX(1.6vw)}
.main-title .accent{color:var(--accent)}
.accent-green{color:#55ff88}
.description{max-width:980px;margin:12px auto;color:rgba(255,255,255,0.65);font-size:12px;letter-spacing:3px;text-transform:uppercase;line-height:1.6}
.compass-wrap{position:absolute;left:50%;top:48%;transform:translate(-50%,-55%);width:90vmin;height:90vmin;max-width:1200px;max-height:1200px;margin:0;display:flex;align-items:center;justify-content:center;opacity:0;animation:compassIn 1000ms ease forwards 520ms;z-index:5}
@keyframes compassIn{to{opacity:1}}
.compass-center{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:6}
.compass-circle{width:36%;height:36%;min-width:200px;min-height:120px;border-radius:12px;border:none;box-shadow:none;backdrop-filter:none;background:transparent}
.arm{position:absolute;background:rgba(255,255,255,0.06);z-index:2}
.arm-n{left:50%;top:50%;width:2px;height:calc(50% - 18%);transform:translateX(-50%) translateY(-100%)}
.arm-s{left:50%;top:50%;width:2px;height:calc(50% - 18%);transform:translateX(-50%)}
.arm-e{left:50%;top:50%;height:2px;width:calc(50% - 18%);transform:translateY(-50%)}
.arm-w{left:50%;top:50%;height:2px;width:calc(50% - 18%);transform:translateX(-100%) translateY(-50%)}
.dir{position:absolute;display:flex;align-items:center;justify-content:center;width:20%;height:20%;border-radius:6px;color:#fff;font-weight:500;text-decoration:none;letter-spacing:2px;transition:all 140ms ease, transform 140ms ease;background:transparent;border:none;font-size:clamp(20px,8vw,100px);opacity:0.5;z-index:7;transform-origin:center}
.dir:active{transform:scale(0.98)}
.dir-n{top:1.5%;left:50%;transform:translateX(-50%);} 
.dir-e{right:0.8%;top:50%;transform:translateY(-50%);} 
.dir-s{bottom:1.5%;left:50%;transform:translateX(-50%);} 
.dir-w{left:0.8%;top:50%;transform:translateY(-50%);} 
.dir::after{content:'';position:absolute;inset:0;border-radius:6px;box-shadow:0 0 24px rgba(79,225,255,0);pointer-events:none}
.dir:hover{color:var(--accent);opacity:1;background:rgba(255,255,255,0.03);box-shadow:0 0 48px rgba(79,225,255,0.06)}
.dir:focus{opacity:1;background:rgba(255,255,255,0.03);} 
.dir-n:hover{transform:translateX(-50%) scale(1.02)}
.dir-s:hover{transform:translateX(-50%) scale(1.02)}
.dir-e:hover{transform:translateY(-50%) scale(1.02)}
.dir-w:hover{transform:translateY(-50%) scale(1.02)}
.dir:focus{opacity:1;background:rgba(255,255,255,0.03);}
.site-footer{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;color:rgba(255,255,255,0.35);font-size:12px;letter-spacing:2px;z-index:20}
.site-footer a{color:inherit;text-decoration:underline;opacity:0.9}
@media (max-width:900px){.main-title{font-size:clamp(22px,5.2vw,48px);transform:translateX(-2vw);letter-spacing:5px}.compass-wrap{width:84vmin;height:84vmin}}
@media (max-width:520px){.main-title{font-size:20px;letter-spacing:4px;transform:none}.main-title .accent-green{transform:none}.description{font-size:11px;letter-spacing:2px}.compass-wrap{width:96vmin;height:96vmin}.dir{width:36%;height:36%}}
.dir:focus{outline:2px solid rgba(79,225,255,0.16);outline-offset:6px}
a{color:inherit}
</style>
</head>
<body>
  <!-- Background video and overlay -->
  <video id="bgVideo" class="bg-video" autoplay muted loop playsinline>
    <source src="assets/background.mp4" type="video/mp4">
    <!-- fallback text if video not supported -->
  </video>
  <div class="bg-overlay"></div>

  <!-- Hidden ambient audio; controlled via JS -->
  <audio id="ambientAudio" loop src="assets/ambient.mp3"></audio>

  <!-- Top-right controls -->
  <div class="top-controls">
    <button id="soundToggle" class="btn-ghost sound-off" aria-pressed="false" title="Toggle sound">🔈</button>
  </div>

  <!-- Main content container -->
  <main class="center-wrap">
      <!-- Title and description (updated) -->
      <h1 class="main-title">Keyframes <span class="accent-green">Lab</span></h1>

      <div class="description">
        <p>They say in the Beginning there was keyframes, and the keyframes bore fruit.</p>
      </div>

    <!-- Compass navigation -->
    <div class="compass-wrap" id="compass" role="navigation" aria-label="Compass navigation">
      <div class="compass-center" aria-hidden="true">
        <div class="compass-circle"></div>
      </div>

      <a class="dir dir-n" data-dir="north" href="#" aria-label="North" data-letter="N">N</a>
      <a class="dir dir-e" data-dir="east" href="#" aria-label="East" data-letter="E">E</a>
      <a class="dir dir-s" data-dir="south" href="contact.html" aria-label="South" data-letter="S">S</a>
      <a class="dir dir-w" data-dir="west" href="#" aria-label="West" data-letter="W">W</a>

      <!-- thin arms -->
      <span class="arm arm-n"></span>
      <span class="arm arm-e"></span>
      <span class="arm arm-s"></span>
      <span class="arm arm-w"></span>
    </div>

  </main>

  <footer class="site-footer">@ NicheLab Inc. | <a href="https://discord.gg/nac8qj5Cuc" target="_blank">JOIN DISCORD</a></footer>

  <script>
// inlined from js/script.js
// Handles ambient audio, sound toggle, and compass navigation.

document.addEventListener('DOMContentLoaded', () => {
  const audio = document.getElementById('ambientAudio');
  const soundToggle = document.getElementById('soundToggle');
  const dirs = document.querySelectorAll('.dir');
  const THEME_KEY = 'front-audio-enabled';

  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) { saved = null }
  let audioEnabled = saved === 'true';

  function setSoundState(enabled){
    audioEnabled = !!enabled;
    if(audioEnabled){
      audio.play().catch(()=>{});
      soundToggle.classList.remove('sound-off');
      soundToggle.classList.add('sound-on');
      soundToggle.setAttribute('aria-pressed','true');
      soundToggle.textContent = '🔊';
    } else {
      try{ audio.pause(); audio.currentTime = 0 }catch(e){}
      soundToggle.classList.remove('sound-on');
      soundToggle.classList.add('sound-off');
      soundToggle.setAttribute('aria-pressed','false');
      soundToggle.textContent = '🔈';
    }
    try{ localStorage.setItem(THEME_KEY, String(audioEnabled)); }catch(e){}
  }

  function initAutoplayOnInteraction(){
    if(audioEnabled) return;
    const onFirst = () => {
      try{ audio.play().then(()=>{ setSoundState(true); }) }catch(e){}
      window.removeEventListener('pointerdown', onFirst);
      window.removeEventListener('keydown', onFirst);
    };
    window.addEventListener('pointerdown', onFirst, {once:true});
    window.addEventListener('keydown', onFirst, {once:true});
  }

  soundToggle.addEventListener('click', (e)=>{
    e.preventDefault();
    setSoundState(!audioEnabled);
  });

  setSoundState(audioEnabled);
  initAutoplayOnInteraction();

  const routes = { north: 'main.html', east: 'Tierlist.html', south: 'contact.html', west: 'https://www.roblox.com/communities/5542605/floob' };
  dirs.forEach(dir => {
    const which = dir.dataset.dir;
    if(!which) return;
    const letter = (dir.dataset.letter || which[0].toUpperCase());
    dir.dataset.letter = letter;
    dir.textContent = letter;

    dir.addEventListener('click', (ev)=>{
      if(dir.getAttribute('target') === '_blank') return;
      ev.preventDefault();
      const base = (which === 'north' || which === 'south') ? 'translateX(-50%)' : 'translateY(-50%)';
      dir.animate([
        { transform: `${base} scale(1)` },
        { transform: `${base} scale(0.96)` }
      ], { duration: 140, fill: 'forwards' });
      setTimeout(()=>{
        const target = routes[which];
        if(typeof target === 'string' && /^https?:\/\//.test(target)){
          window.open(target, '_blank');
        } else {
          window.location.href = target;
        }
      }, 180);
    });

    dir.addEventListener('keydown', (ev)=>{
      if(ev.key === 'Enter' || ev.key === ' ') dir.click();
    });
  });

  document.body.addEventListener('pointerdown', ()=>{
    if(audioEnabled) return;
    try{ audio.play().then(()=>{ setSoundState(true) }).catch(()=>{}); }catch(e){}
  }, {once:true});

  window.addEventListener('keydown', (ev)=>{
    const key = ev.key.toLowerCase();
    if(key !== 'n' && key !== 's') return;
    const active = document.activeElement;
    if(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) return;
    const which = key === 'n' ? 'north' : 'south';
    const target = routes[which];
    if(typeof target === 'string' && /^https?:\/\//.test(target)){
      window.open(target, '_blank');
    } else {
      window.location.href = target;
    }
  });

});
</script>
</body>
</html>
